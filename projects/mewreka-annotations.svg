="19" font-weight="400" text-anchor="start">复制对应正文并保存级别</text></g><g><rect x="430" y="300" width="280" height="110" rx="16" fill="#FFFFFF" stroke="#DCE3DB" stroke-width="1.5"/><rect x="430" y="318" width="4" height="74" rx="2" fill="#245B46"/><text x="452" y="335" fill="#243A32" font-size="24" font-weight="600" text-anchor="start">分析页面可用空间</text><text x="452" y="365" fill="#63766A" font-size="19" font-weight="400" text-anchor="start">文字位置 + 页面像素</text><text x="452" y="392" fill="#63766A" font-size="19" font-weight="400" text-anchor="start">避开正文与已有标注</text></g><g><path d="M 570 540 L 685 596 L 570 652 L 455 596 Z" fill="#FFFFFF" stroke="#245B46" stroke-width="1.6"/><text x="570" y="604" fill="#243A32" font-size="22" font-weight="500" text-anchor="middle">页内有安全空白？</text></g><g><rect x="840" y="390" width="280" height="110" rx="16" fill="#E9F1E8" stroke="#E9F1E8" stroke-width="1.5"/><rect x="840" y="408" width="4" height="74" rx="2" fill="#245B46"/><text x="862" y="425" fill="#243A32" font-size="24" font-weight="600" text-anchor="start">页内安全位置</text><text x="862" y="455" fill="#63766A" font-size="19" font-weight="400" text-anchor="start">测量文字，适配大小与形状</text><text x="862" y="482" fill="#63766A" font-size="18.1" font-weight="400" text-anchor="start">选择与正文、背景区分的配色</text></g><g><rect x="840" y="610" width="280" height="110" rx="16" fill="#E9F1E8" stroke="#E9F1E8" stroke-width="1.5"/><rect x="840" y="628" width="4" height="74" rx="2" fill="#245B46"/><text x="862" y="645" fill="#243A32" font-size="24" font-weight="600" text-anchor="start">页边批注区</text><text x="862" y="675" fill="#63766A" font-size="19" font-weight="400" text-anchor="start">空间不足时自动移出正文</text><text x="862" y="702" fill="#63766A" font-size="19" font-weight="400" text-anchor="start">长内容按需分块</text></g><g><rect x="1240" y="390" width="288" height="130" rx="16" fill="#FFFFFF" stroke="#DCE3DB" stroke-width="1.5"/><rect x="1240" y="408" width="4" height="94" rx="2" fill="#245B46"/><text x="1262" y="425" fill="#243A32" 
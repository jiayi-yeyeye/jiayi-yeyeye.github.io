<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">自动化埋点 SDK核心功能流程图</title><desc id="desc">自动化埋点 SDK 是连接业务页面与 EventFlow 的采集执行引擎。它以稳定控件标识、业务钩子和字段规范为基础，支持管理员圈选页面目标、手动绑定字段，或由服务端 AI 辅助生成规则草稿。针对重复卡片和不同 Tab，SDK 在触发瞬间读取实例 ID、类型、位置等上下文，避免依赖按钮文案或列表顺序。配置经校验、测试与审核发布后执行，采集结果再由服务端核验来源与环境，并返回接收、重复或拒收回执。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9 Z" fill="#9AA8A2"/></marker></defs><rect width="1600" height="1000" fill="#FAFBF9"/><rect x="64" y="48" width="36" height="5" rx="2.5" fill="#237F82"/><text x="116" y="57" fill="#237F82" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="600" text-anchor="start" letter-spacing="2">VISUAL &amp; AI-ASSISTED TRACKING</text><text x="1536" y="79" fill="#A7B1AB" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="400" text-anchor="end" >03 / 03</text><text x="64" y="119" fill="#25382D" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="46" font-weight="600" text-anchor="start" >自动化埋点 SDK</text><text x="64" y="162" fill="#69776E" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="21" font-weight="400" text-anchor="start" >用规范约束配置，用真实触发记录行为与业务结果。</text><line x1="64" y1="192" x2="1536" y2="192" stroke="#DFE6DF"/><path d="M280 480 L310 480" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M526 480 L541 480" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  /><path d="M541 380 L541 580" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  /><path d="M541 380 L556 380" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M541 580 L556 580" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M772 380 L787 380" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  /><path d="M772 580 L787 580" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  /><path d="M787 380 L787 580" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  /><path d="M787 480 L802 480" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M1018 480 L1048 480" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M1264 480 L1294 480" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M1402 536 L1402 670" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M910 546 L910 670" fill="none" stroke="#9AA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"  marker-end="url(#arrow)"/><path d="M960 670 L960 602 L974 602 L974 507" fill="none" stroke="#9BA8A2" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="7 6" marker-end="url(#arrow)"/><rect x="64" y="424" width="216" height="112" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="1.6"/><text x="172" y="446" fill="#237F82" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.8">REGISTER</text><text x="172" y="473" fill="#26362E" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" text-anchor="middle" >注册采集能力</text><text x="172" y="501" fill="#6C7872" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" text-anchor="middle" >稳定控件标识</text><text x="172" y="523" fill="#6C7872" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" text-anchor="middle" >真实业务结果钩子</text><rect x="310" y="424" width="216" height="112" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="1.6"/><text x="418" y="446" fill="#237F82" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.8">SELECT</text><text x="418" y="473" fill="#26362E" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" text-anchor="middle" >管理员圈选目标</text><text x="418" y="501" fill="#6C7872" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" text-anchor="middle" >由 EventFlow 启动</text><text x="418" y="523" fill="#6C7872" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" text-anchor="middle" >短期授权后加载工具</text><rect x="556" y="324" width="216" height="112" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="1.6"/><text x="664" y="346" fill="#237F82" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.8">MANUAL</text><text x="664" y="373" fill="#26362E" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" text-anchor="middle" >手动绑定字段</text><text x="664" y="401" fill="#6C7872" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" text-anchor="middle" >选择范围与字段来源</text><rect x="556" y="524" width="21
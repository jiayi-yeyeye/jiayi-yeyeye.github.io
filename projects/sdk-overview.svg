o Sans CJK SC',sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.8">EXECUTE</text><text x="1402" y="473" fill="#26362E" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" text-anchor="middle" >执行已审核规则</text><text x="1402" y="501" fill="#6C7872" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" text-anchor="middle" >交互与业务信号分开</text><text x="1402" y="523" fill="#6C7872" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" text-anchor="middle" >实例上下文实时取值</text><rect x="802" y="670" width="216" height="112" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="1.6"/><text x="910" y="692" fill="#237F82" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.8">REFINE</text><text x="910" y="719" fill="#26362E" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" text-anchor="middle" >调整字段与范围</text><text x="910" y="747" fill="#6C7872" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" text-anchor="middle" >按校验提示修正草稿</text><rect x="1294" y="670" width="216" height="112" rx="16" fill="#FFFFFF" stroke="#DCE3DF" stroke-width="1.6"/><text x="1402" y="692" fill="#237F82" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1.8">DELIVER</text><text x="1402" y="719" fill="#26362E" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="22" font-weight="600" text-anchor="middle" >服务端校验与回执</text><text x="1402" y="747" fill="#6C7872" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" text-anchor="middle" >环境与来源再次核验</text><text x="1402" y="769" fill="#6C7872" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" text-anchor="middle" >接收 / 重复 / 拒收</text><text x="172" y="226" fill="#748078" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing=".7">能力注册</text><text x="418" y="226" fill="#748078" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing=".7">授权圈选</text><text x="664" y="226" fill="#748078" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing=".7">字段规划</text><text x="910" y="226" fill="#748078" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing=".7">规则校验</text><text x="1156" y="226" fill="#748078" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing=".7">平台验收</text><text x="1402" y="226" fill="#748078" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="14" font-weight="500" text-anchor="middle" letter-spacing=".7">采集执行</text><text x="910" y="382" fill="#6C7872" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="16" font-weight="400" text-anchor="middle" >检查字段、来源与作用范围</text><text x="928" y="613" fill="#7B8781" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="17" font-weight="400" text-anchor="start" >否</text><text x="1033" y="458" fill="#237F82" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="17" font-weight="600" text-anchor="middle" >是</text><rect x="64" y="840" width="1472" height="118" rx="17" fill="#EAF4F2"/><text x="88" y="884" fill="#237F82" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="28" font-weight="600" text-anchor="start" >把采集规则配置化，把发布决定留给人。</text><text x="88" y="923" fill="#5D6E62" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="18" font-weight="400" text-anchor="start" >稳定控件标识 · 重复卡片与 Tab 上下文 · 白名单字段 · 客户端与服务端职责分离</text><text x="1536" y="982" fill="#A5AEA8" font-family="'PingFang SC','Hiragino Sans GB','Noto Sans CJK SC',sans-serif" font-size="11" font-weight="500" text-anchor="end" letter-spacing="1.6">PRODUCT FLOW  /  PORTFOLIO EDITION</text></svg>
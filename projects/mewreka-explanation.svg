><rect x="1149" y="301" width="34" height="27" rx="6" fill="#F7F8F5"/><text x="1166" y="320" fill="#63766A" font-size="18" font-weight="400" text-anchor="middle">否</text><rect x="988" y="412" width="34" height="27" rx="6" fill="#F7F8F5"/><text x="1005" y="431" fill="#63766A" font-size="18" font-weight="400" text-anchor="middle">是</text><rect x="970" y="637" width="160" height="27" rx="6" fill="#F7F8F5"/><text x="1050" y="656" fill="#63766A" font-size="18" font-weight="400" text-anchor="middle">用户选择继续深入</text><rect x="865" y="717" width="70" height="27" rx="6" fill="#F7F8F5"/><text x="900" y="736" fill="#63766A" font-size="18" font-weight="400" text-anchor="middle">第一次</text><rect x="1185" y="717" width="70" height="27" rx="6" fill="#F7F8F5"/><text x="1220" y="736" fill="#63766A" font-size="18" font-weight="400" text-anchor="middle">第二次</text><line x1="72" y1="846" x2="1528" y2="846" stroke="#DCE3DB"/><text x="72" y="884" fill="#245B46" font-size="18" font-weight="600" text-anchor="start">关键产品决策</text><text x="72" y="922" fill="#243A32" font-size="24" font-weight="400" text-anchor="start">词语简要版先独立解释，仅多义时查上下文；每条记录最多展开两次，失败不推进级别。</text><text x="72" y="970" fill="#63766A" font-size="16" font-weight="400" text-anchor="start">产品流程 · 基于当前实现</text><text x="1528" y="970" fill="#63766A" font-size="16" font-weight="400" text-anchor="end">2026.11   /   PORTFOLIO</text></svg>
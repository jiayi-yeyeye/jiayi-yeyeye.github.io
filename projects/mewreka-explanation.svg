cap="round" stroke-linejoin="round"  marker-end="url(#arrow)"/><text x="72" y="246" fill="#63766A" font-size="19" font-weight="500" text-anchor="start">用户选取</text><text x="350" y="246" fill="#63766A" font-size="19" font-weight="500" text-anchor="start">输入检查</text><text x="620" y="246" fill="#63766A" font-size="19" font-weight="500" text-anchor="start">AI 处理与上下文策略</text><text x="1240" y="246" fill="#63766A" font-size="19" font-weight="500" text-anchor="start">分级输出</text><g><rect x="72" y="350" width="220" height="110" rx="16" fill="#FFFFFF" stroke="#DCE3DB" stroke-width="1.5"/><rect x="72" y="368" width="4" height="74" rx="2" fill="#245B46"/><text x="94" y="385" fill="#243A32" font-size="24" font-weight="600" text-anchor="start">划词 / 框选</text><text x="94" y="415" fill="#63766A" font-size="19" font-weight="400" text-anchor="start">积累选区后确认解析</text><text x="94" y="442" fill="#63766A" font-size="19" font-weight="400" text-anchor="start">保留原文位置与目标</text></g><g><path d="M 445 350 L 540 405 L 445 460 L 350 405 Z" fill="#FFFFFF" stroke="#245B46" stroke-width="1.6"/><text x="445" y="413" fill="#243A32" font-size="22" font-weight="500" text-anchor="middle">内容可解析？</text></g><g><rect x="620" y="285" width="220" height="104" rx="16" fill="#EDF1FA" stroke="#EDF1FA" stroke-width="1.5"/><rect x="620" y="303" width="4" height="68" rx="2" fill="#4E67A3"/><text x="642" y="320" fill="#243A32" font-size="24" font-weight="600" text-anchor="start">词语独立判断</text><text x="642" y="350" fill="#63766A" font-size="19" font-weight="400" text-anchor="start">仅发送目标词</text><text x="642" y="377" fill="#63766A" font-size="19" font-weight="400" text-anchor="start">不携带文档或历史</text></g><g><path d="M 1005 285 L 1110 337 L 1005 389 L 900 337 Z" fill="#FFFFFF" stroke="#245B46" stroke-width="1.6"/><text x="1005" y="345" fill="#243A32" font-size="22" font-weight="500" text-anchor="middle">存在多个含义？</text></g><g><rect x="900" y="460" width="220" height="104" rx="16" fill="#EDF1FA" stroke="#EDF1FA" stroke-width="1.5
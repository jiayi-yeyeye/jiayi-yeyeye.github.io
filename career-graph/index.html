function createGraphPhysics({ nodes, links, positions }) {
  const byId = new Map(nodes.map(node => [node.id, node]));
  const springs = links.map(link => {
    const a = positions.get(link.source), b = positions.get(link.target);
    return { source: link.source, target: link.target,
      length: Math.hypot(b.x - a.x, b.y - a.y),
      strength: ['contains', 'has_category'].includes(link.relation) ? 0.027 : 0.009 };
  });
  let active = nodes.map(node => node.id), activeSprings = springs;
  const clearVelocity = () => positions.forEach(p => { p.vx = 0; p.vy = 0; });
  clearVelocity();
  return {
    clearVelocity,
    setVisible(ids) {
      const visible = new Set(ids);
      active = ids.filter(id => positions.has(id));
      activeSprings = springs.filter(s => visible.has(s.source) && visible.has(s.target));
      clearVelocity();
    },
    release(id) {
      const p = positions.get(id);
      if (p) { p.ax = p.x; p.ay = p.y; p.vx = 0; p.vy = 0; }
    },
    step(heldId = null, elapsed = 1) {
      const dt = Math.max(0.4, Math.min(1.5, elapsed));
      const force = new Map(active.map(id => [id, { x: 0, y: 0 }]));
      for (const id of active) {
        const p = positions.get(id), node = byId.get(id), f = force.get(id);
        const anchor = node.category === 'person' ? 0.032 : node.kind === 'category_hub' ? 0.018 : 0.024;
        f.x += (p.ax - p.x) * anchor;
        f.y += (p.ay - p.y) * anchor;
      }
      for (const spring of activeSprings) {
        const a = positions.get(spring.source), b = positions.get(spring.target);
        const dx = b.x - a.x, dy = b.y - a.y, length = Math.hypot(dx, dy) || 0.01;
        const pull = Math.max(-5, Math.min(5, (length - spring.length) * spring.strength));
        const fx = dx / length * pull, fy = dy / length * pull;
        force.get(spring.source).x += fx; force.get(spring.source).y += fy;
        force.get(spring.target).x -= fx; force.get(spring.target).y -= fy;
      }
      for (let i = 0; i < active.length; i++) for (let j = i + 1; j < active.length; j++) {
        const aid = active[i], bid = active[j], a = positions.get(aid), b = positions.get(bid);
        let dx = b.x - a.x, dy = b.y - a.y;
        if (Math.abs(dx) + Math.abs(dy) < 0.001) { dx = 0.01; dy = 0.01; }
        const distance = Math.hypot(dx, dy);
        const radius = id => byId.get(id).category === 'person' ? 42 : byId.get(id).kind === 'category_hub' ? 35 : 20;
        const clearance = radius(aid) + radius(bid) + 9;
        const collision = Math.max(0, clearance - distance) * 0.075;
        const repulsion = distance < 170 ? 0.12 * Math.pow(1 - distance / 170, 2) : 0;
        const fx = dx / distance * (collision + repulsion), fy = dy / distance * (collision + repulsion);
        force.get(aid).x -= fx; force.get(aid).y -= fy;
        force.get(bid).x += fx; force.get(bid).y += fy;
      }
      let speed = 0;
      const damping = Math.pow(0.9, dt);
      for (const id of active) {
        const p = positions.get(id), f = force.get(id);
        if (id === heldId) { p.vx = 0; p.vy = 0; continue; }
        p.vx = Math.max(-16, Math.min(16, (p.vx + f.x * dt) * damping));
        p.vy = Math.max(-16, Math.min(16, (p.vy + f.y * dt) * damping));
        p.x += p.vx * dt; p.y += p.vy * dt;
        speed = Math.max(speed, Math.hypot(p.vx, p.vy));
      }
      return speed;
    }
  };
}

$('#full').addEventListener('change',e=>{stopTour();state.full=e.target.checked;state.path=[];updateAll();});
$('#search').addEventListener('input',search);$('#search').addEventListener('focus',search);$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){$('#searchResults button')?.click();}if(e.key==='Escape')$('#searchResults').hidden=true;});
$('#reset').addEventListener('click',reset);$('#brand').addEventListener('click',e=>{e.preventDefault();reset();});$('#fit').addEventListener('click',fit);$('#zoomIn').addEventListener('click',()=>zoom(.8));$('#zoomOut').addEventListener('click',()=>zoom(1.25));$('#graphTab').addEventListener('click',()=>{stopTour();setView('graph');});$('#timeTab').addEventListener('click',()=>{stopTour();setView('timeline');});$('#traceButton').addEventListener('click',tracePath);
$('#tourStart').addEventListener('click',()=>startTour());$('#tourPrev').addEventListener('click',()=>{if(state.tourStep>0){state.tourStep--;showTour();}});$('#tourNext').addEventListener('click',()=>{if(state.tourStep<DATA.tours[state.tour].node_ids.length-1){state.tourStep++;showTour();}else if(state.tour===0)startTour(1);else{stopTour();closeDetails();}});$('#tourClose').addEventListener('click',stopTour);
$('#about').addEventListener('click',()=>$('#aboutDialog').showModal());$('#aboutClose').addEventListener('click',()=>$('#aboutDialog').close());$('#aboutDialog').addEventListener('click',e=>{if(e.target===$('#aboutDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
$('#downloadData').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='叶佳奕-职业图谱数据.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus();}if(e.key==='Escape'&&!$('#aboutDialog').open){stopTour();$('#searchResults').hidden=true;closeDetails();}});
$('#full').checked=true;layout();updateAll();renderOverview();

const sendHeight=()=>parent.postMessage({type:'career-graph-height',height:Math.ceil(document.body.getBoundingClientRect().height)},location.origin);new ResizeObserver(sendHeight).observe(document.body);sendHeight();
</script>
</body></html>

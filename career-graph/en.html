"skill-evidence","proj-folia","proj-mewreka"],"story":"按公司、项目与专业技能理解方法和经验领域。"}]}</script><script>/* Shared, DOM-independent spring simulation for the embedded and offline graphs. */
function createGraphPhysics({ nodes, links, positions }) {
  const byId = new Map(nodes.map(node => [node.id, node]));
  const springs = links.map(link => {
    const a = positions.get(link.source), b = positions.get(link.target);
    return { source: link.source, target: link.target,
      length: Math.hypot(b.x - a.x, b.y - a.y),
      strength: ['contains', 'has_category'].includes(link.relation) ? 0.027 : 0.009 };
  });
  let active = nodes.map(node => node.id), activeSprings = springs;
  const clearVelocity = () => positions.forEach(p => { p.vx = 0; p.vy = 0; });
  clearVelocity();
  return {
    clearVelocity,
    setVisible(ids) {
      const visible = new Set(ids);
      active = ids.filter(id => positions.has(id));
      activeSprings = springs.filter(s => visible.has(s.source) && visible.has(s.target));
      clearVelocity();
    },
    release(id) {
      const p = positions.get(id);
      if (p) { p.ax = p.x; p.ay = p.y; p.vx = 0; p.vy = 0; }
    },
    step(heldId = null, elapsed = 1) {
      const dt = Math.max(0.4, Math.min(1.5, elapsed));
      const force = new Map(active.map(id => [id, { x: 0, y: 0 }]));
      for (const id of active) {
        const p = positions.get(id), node = byId.get(id), f = force.get(id);
        const anchor = node.category === 'person' ? 0.032 : node.kind === 'category_hub' ? 0.018 : 0.024;
        f.x += (p.ax - p.x) * anchor;
        f.y += (p.ay - p.y) * anchor;
      }
      for (const spring of activeSprings) {
        const a = positions.get(spring.source), b = positions.get(spring.target);
        const dx = b.x - a.x, dy = b.y - a.y, length = Math.hypot(dx, dy) || 0.01;
        const pull = Math.max(-5, Math.min(5, (length - spring.length) * spring.strength));
        const fx = dx / length * pull, fy = dy / length * pull;
        force.get(spring.source).x += fx; force.get(spring.source).y += fy;
        force.get(spring.target).x -= fx; force.get(spring.target).y -= fy;
      }
      for (let i = 0; i < active.length; i++) for (let j = i + 1; j < active.length; j++) {
        const aid = active[i], bid = active[j], a = positions.get(aid), b = positions.get(bid);
        let dx = b.x - a.x, dy = b.y - a.y;
        if (Math.abs(dx) + Math.abs(dy) < 0.001) { dx = 0.01; dy = 0.01; }
        const distance = Math.hypot(dx, dy);
        const radius = id => byId.get(id).category === 'person' ? 42 : byId.get(id).kind === 'category_hub' ? 35 : 20;
        const clearance = radius(aid) + radius(bid) + 9;
        const collision = Math.max(0, clearance - distance) * 0.075;
        const repulsion = distance < 170 ? 0.12 * Math.pow(1 - distance / 170, 2) : 0;
        const fx = dx / distance * (collision + repulsion), fy = dy / distance * (collision + repulsion);
        force.get(aid).x -= fx; force.get(aid).y -= fy;
        force.get(bid).x += fx; force.get(bid).y += fy;
      }
      let speed = 0;
      const damping = Math.pow(0.9, dt);
      for (const id of active) {
        const p = positions.get(id), f = force.get(id);
        if (id === heldId) { p.vx = 0; p.vy = 0; continue; }
        p.vx = Math.max(-16, Math.min(16, (p.vx + f.x * dt) * damping));
        p.vy = Math.max(-16, Math.min(16, (p.vy + f.y * dt) * damping));
        p.x += p.vx * dt; p.y += p.vy * dt;
        speed = Math.max(speed, Math.hypot(p.vx, p.vy));
      }
      return speed;
    }
  };
}

 for(const n of visible){const p=positions.get(n.id),c=cats.get(n.category),root=n.category==='person',hub=n.kind==='category_hub',r=root?32:hub?26:n.category==='project'?12:9;const g=svgEl('g',{transform:`translate(${p.x} ${p.y})`,class:'node'+(root?' root':hub?' category-hub':''),tabindex:'0',role:'button','aria-label':`${c.label}：${n.label}`,'data-id':n.id},nodeLayer);svgEl('circle',{r:r+7,class:'halo',stroke:c.color},g);if(root)svgEl('circle',{r:43,fill:'#9d80ff',opacity:'.1',filter:'url(#glow)'},g);svgEl('circle',{r,fill:root?'url(#rootFill)':c.color+'39',stroke:c.color,class:'disc'},g);if(root||hub){svgEl('text',{x:0,y:6,'text-anchor':'middle',fill:'#f5edff','font-size':19},g).textContent=root?'JY':n.details.icon;}const txt=svgEl('text',{x:0,y:r+20,class:'label'},g);const caption=shortNames[n.id]||n.label;if(caption.length>19&&caption.includes(' ')){const spaces=[...caption.matchAll(/ /g)].map(m=>m.index);const split=spaces.reduce((a,b)=>Math.abs(b-caption.length/2)<Math.abs(a-caption.length/2)?b:a);svgEl('tspan',{x:0},txt).textContent=caption.slice(0,split);svgEl('tspan',{x:0,dy:19},txt).textContent=caption.slice(split+1);}else txt.textContent=caption;svgEl('title',{},g).textContent=n.label+'\n'+n.summary;g.addEventListener('click',()=>{if(performance.now()>suppressClickUntil&&!pointer?.moved)selectNode(n.id);});g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(n.id);}});g.addEventListener('pointerdown',e=>startPointer(e,n.id));}
 updateHighlight();$('#count').textContent=`${visible.filter(n=>n.kind!=='category_hub').length} NODES / ${visibleLinks.length} LINKS`;renderTraceOptions();
}
function updateHighlight(){let lit=new Set(state.path);if(!lit.size&&state.selected){lit.add(state.selected);for(const l of visibleLinks){if(l.source===state.selected)lit.add(l.target);if(l.target===state.selected)lit.add(l.source);}}const has=lit.size>0;for(const g of $('#nodeLayer').children){const id=g.dataset.id;g.classList.toggle('dim',has&&!lit.has(id));g.classList.toggle('lit',has&&lit.has(id));g.classList.toggle('selected',id===state.selected);}const pathPairs=new Set();for(let i=1;i<state.path.length;i++){pathPairs.add(state.path[i-1]+'|'+state.path[i]);pathPairs.add(state.path[i]+'|'+state.path[i-1]);}for(const l of visibleLinks){const el=$('#edgeLayer').querySelector(`[data-edge="${l.id}"]`);const on=state.path.length?pathPairs.has(l.source+'|'+l.target):(l.source===state.selected||l.target===state.selected);el.classList.toggle('lit',!!on);el.classList.toggle('dim',has&&!on);}}
function updateAll({refit=true}={}){calculateVisible();renderCategories();renderGraph();renderTimeline();if(refit)fit();if(state.selected&&!visible.some(n=>n.id===state.selected)){closeDetails();}}
function ensureVisible(id){const n=byId.get(id);if(!n)return;if(!n.core){state.full=true;$('#full').checked=true;}state.hidden.delete(n.category);updateAll();}
function dateLabel(n){if(!n.start)return 'Project dates not supplied';return `${n.start.replace('-','.')} — ${n.ongoing?'Present':n.end?.replace('-','.')||'Not supplied'}${n.details.end_status==='expected'?' · Expected '+n.end.replace('-','.')+' graduation':''}${n.date_basis==='experience_window_only'?' · Internship context window':''}`;}
function announce(t){$('#announcement').textContent=t;}
function selectNode(id,{keepPath=false}={}){if(!byId.has(id))return;if(!visible.some(n=>n.id===id))ensureVisible(id);state.selected=id;if(!keepPath)state.path=[];renderDetails(byId.get(id));updateHighlight();$('#stageTitle').textContent=byId.get(id).label;announce(`Selected: ${byId.get(id).label}. Details and connections appear in the side panel.`);}
function closeDetails(){state.selected=null;state.path=[];$('#stageTitle').textContent='Career Knowledge Graph';renderOverview();updateHighlight();$('#traceStatus').textContent='Connections do not imply causation';}
function renderOverview(){
 const entities=DATA.nodes.filter(n=>n.kind!=='category_hub');
 $('#details').innerHTML=`<div class="detail-content"><div class="overview-number">${entities.length}<small>content nodes</small></div><div class="overview-line"><div><strong>6</strong><span>categories</span></div><div><strong>${entities.filter(n=>n.category==='project').length}</strong><span>projects</span></div><div><strong>${entities.filter(n=>n.category==='skill').length}</strong><span>skills</span></div></div><div class="section-label">EXPLORE SKILLS <span>EXPLORE</span></div><button class="suggestion" data-pick="skill-governance"><b>↗</b><span>Data Governance</span><small>Event specifications, metric definitions and consistency</small></button><button class="suggestion" data-pick="skill-agent"><b>↗</b><span>AI Workflow Design</span><small>Rules, models, retrieval and human checkpoints</small></button><button class="suggestion" data-pick="skill-prd"><b>↗</b><span>PRDs & Interaction Design</span><small>Requirements, rules and interaction design</small></button><div class="note">Six category hubs organize the map. Dashed lines connect projects, skills and application domains.</div></div>`;
}
function renderDetails(n){const c=cats.get(n.category),neighbors=DATA.links.filter(l=>l.source===n.id||l.target===n.id),wfs=DATA.workflows.filter(w=>w.project_id===n.id||(n.id==='proj-baidu'&&w.scope==='template')),questions=DATA.review_questions.filter(q=>q.node_ids.includes(n.id));
 const details=(n.details.my_role||n.details.role)?`<div class="panel-section"><h3 class="section-label">My role</h3><div class="responsibility">${esc(n.details.my_role||n.details.role)}</div></div>`:'';
 const flows=DATA.platform_flows.filter(f=>f.enabled!==false&&(f.source===n.id||f.target===n.id));
 const workflowHtml=wfs.map(w=>`<details class="workflow"><summary>${w.scope==='template'?'Illustrative method (not a completed personal case)':'Workflow'} · ${esc(w.label)} <span>(${w.steps.length})</span></summary><div class="workflow-body">${w.steps.map(s=>`<div class="step"><strong>${s.order}. ${esc(s.label)}</strong><p>Input: ${s.inputs.map(esc).join(', ')}<br>Process: ${esc(s.processing)}<br>Output: ${s.outputs.map(esc).join(', ')}<br>Participants: ${s.collaborators.map(esc).join(', ')}<br><em>My work: ${esc(s.my_responsibility)}</em></p></div>`).join('')}<div class="note">${w.boundaries.map(esc).join('<br>')}</div></div></details>`).join('');
 $('#details').innerHTML=`<div class="detail-content"><div class="panel-eyebrow">NODE DETAILS <button class="close" id="detailClose" aria-label="Close details">×</button></div><h2 class="panel-title">${esc(n.label)}</h2><span class="pill category" style="--c:${c.color}">${esc(c.label)}</span>${n.claim_status==='editorial_mapping'?'<span class="pill">Based on supplied materials</span>':''}${n.kind!=='category_hub'&&(n.start||n.category==='project')?`<div class="date">${esc(dateLabel(n))}</div>`:''}<p class="panel-summary" style="margin-top:15px">${esc(n.summary)}</p>${details}${workflowHtml?`<div class="panel-section"><h3 class="section-label">Workflow & Outputs</h3>${workflowHtml}</div>`:''}${flows.length?`<div class="panel-section"><h3 class="section-label">Platform Data Flows</h3>${flows.map(f=>`<div class="note">${esc(shortNames[f.source]||byId.get(f.source).label)} → ${esc(shortNames[f.target]||byId.get(f.target).label)}<br>${f.payload.map(esc).join(', ')}</div>`).join('')}</div>`:''}<div class="panel-section"><h3 class="section-label">Connected Nodes <span>${neighbors.length}</span></h3>${neighbors.map(l=>{const other=byId.get(l.source===n.id?l.target:l.source);return `<button class="neighbor" data-pick="${other.id}" style="--c:${cats.get(other.category).color}"><i></i><span>${esc(other.label)}</span><small>${esc(DATA.relation_labels[l.relation])}${l.source===n.id?' ↗':' ↙'}</small></button>`;}).join('')}</div>${questions.length?`<details class="evidence"><summary>Information to Confirm · ${questions.length}</summary>${questions.map(q=>`<p>${esc(q.question)}<br>${esc(q.handling)}</p>`).join('')}</details>`:''}<details class="evidence"><summary>Evidence & Sources · ${n.evidence_ids.length}</summary>${n.evidence_ids.map(id=>{const e=evidence.get(id),s=sources.get(e.source_id);return `<p>${esc(s.title)}</p><blockquote>${esc(e.excerpt)}</blockquote>`;}).join('')}</details></div>`;
 $('#detailClose').addEventListener('click',closeDetails);
}
function renderTimeline(){const items=DATA.nodes.filter(n=>n.kind!=='category_hub'&&(n.start||n.category==='project')&&(state.full||n.core)&&!state.hidden.has(n.category));const groups=new Map();for(const n of [...items].sort((a,b)=>(a.start||'9999').localeCompare(b.start||'9999'))){const year=n.start?.slice(0,4)||'Not supplied';if(!groups.has(year))groups.set(year,[]);groups.get(year).push(n);}$('#timelineView').innerHTML=Array.from(groups,([year,ns])=>`<section class="timeline-group"><div class="timeline-year">${year}</div><div class="timeline-items">${ns.map(n=>`<button class="timeline-item" data-pick="${n.id}" style="border-left:2px solid ${cats.get(n.category).color}"><small>${esc(dateLabel(n))}</small><strong>${esc(n.label)}</strong><p>${esc(n.summary)}</p></button>`).join('')}</div></section>`).join('')||'<div class="empty">No timeline entries in the selected categories.</div>';}
function setView(v){stopMotion();state.view=v;$('#graphView').hidden=v!=='graph';$('#timelineView').hidden=v!=='timeline';$('#graphTab').classList.toggle('active',v==='graph');$('#timeTab').classList.toggle('active',v==='timeline');$('#graphTab').setAttribute('aria-pressed',v==='graph');$('#timeTab').setAttribute('aria-pressed',v==='timeline');$('#stageNote').textContent=v==='graph'?'Select a node to explore its connections':'Month-level dates · Research periods and later versions are kept distinct';}
function renderTraceOptions(){for(const id of ['traceFrom','traceTo']){const el=$('#'+id),old=el.value;el.innerHTML=visible.map(n=>`<option value="${n.id}">${esc(n.label)}</option>`).join('');if(visible.some(n=>n.id===old))el.value=old;else el.value=id==='traceFrom'&&visible.some(n=>n.id==='skill-cdp')?'skill-cdp':id==='traceTo'&&visible.some(n=>n.id==='proj-eventflow')?'proj-eventflow':visible[0]?.id;}}
function findPath(from,to){const routeLinks=(from==='person-jiayi'||to==='person-jiayi'||byId.get(from)?.kind==='category_hub'||byId.get(to)?.kind==='category_hub')?visibleLinks:visibleLinks.filter(l=>!['has_category','contains'].includes(l.relation));const queue=[[from]],seen=new Set([from]);while(queue.length){const path=queue.shift(),last=path.at(-1);if(last===to)return path;for(const l of routeLinks){const next=l.source===last?l.target:l.target===last?l.source:null;if(next&&!seen.has(next)){seen.add(next);queue.push([...path,next]);}}}return [];}
function tracePath(){stopTour();const from=$('#traceFrom').value,to=$('#traceTo').value,path=findPath(from,to);if(!path.length){$('#traceStatus').textContent='No path in the current selection. Try restoring categories.';state.path=[];updateHighlight();return;}setView('graph');state.path=path;selectNode(to,{keepPath:true});$('#traceStatus').textContent=`${path.length-1}  hops · ${path.map(id=>shortNames[id]||byId.get(id).label).join(' → ')}`;$('#stageTitle').textContent='Connection Path';announce($('#traceStatus').textContent);}
function search(){const term=$('#search').value.trim().toLocaleLowerCase();state.search=term;const box=$('#searchResults');if(!term){box.hidden=true;return;}const result=DATA.nodes.filter(n=>n.search_text.toLocaleLowerCase().includes(term));box.hidden=false;box.innerHTML=result.length?result.slice(0,20).map(n=>`<button class="search-result" data-pick="${n.id}"><strong>${esc(n.label)}</strong><small>${esc(cats.get(n.category).label)}${!state.full&&!n.core?' · expand to view':''}</small></button>`).join(''):`<div class="empty">No matches for “${esc(term)}”<br>Try Folia, data governance or Baidu.</div>`;}
function svgPoint(e){return new DOMPoint(e.clientX,e.clientY).matrixTransform($('#graph').getScreenCTM().inverse());}
function startPointer(e,id=null){if(e.button!==0)return;e.stopPropagation();const p=svgPoint(e);pointer={id,x:e.clientX,y:e.clientY,startX:p.x,startY:p.y,original:id?{...positions.get(id)}:{...view},moved:false,pid:e.pointerId};$('#graph').setPointerCapture(e.pointerId);}
$('#graph').addEventListener('pointerdown',e=>startPointer(e));
$('#graph').addEventListener('pointermove',e=>{if(!pointer)return;const dx=e.clientX-pointer.x,dy=e.clientY-pointer.y;if(Math.abs(dx)+Math.abs(dy)>4)pointer.moved=true;if(!pointer.moved)return;const p=svgPoint(e);if(pointer.id){const point=positions.get(pointer.id);point.x=p.x;point.y=p.y;point.vx=0;point.vy=0;paintPositions();wakeMotion();}else{const origin=pointer.original;const matrix=$('#graph').getScreenCTM();view.x=origin.x-dx/matrix.a;view.y=origin.y-dy/matrix.d;applyView();}});
let suppressClickUntil=0;
function endPointer(e){if(!pointer)return;const current=pointer;if($('#graph').hasPointerCapture(e.pointerId))$('#graph').releasePointerCapture(e.pointerId);pointer=null;
 const kind=current.id?(current.moved?'drag':'pick'):(current.moved?'pan':state.selected?'close':null);
 if(kind)document.dispatchEvent(new CustomEvent('portfolio-graph-gesture',{detail:{kind,node:current.id}}));
 if(current.id&&current.moved){simulation?.release(current.id);suppressClickUntil=performance.now()+250;wakeMotion();}else if(current.id)selectNode(current.id);else if(!current.moved)closeDetails();}
$('#graph').addEventListener('pointerup',endPointer);
$('#graph').addEventListener('pointercancel',e=>{if(pointer?.id){simulation?.release(pointer.id);wakeMotion();}pointer=null;if($('#graph').hasPointerCapture(e.pointerId))$('#graph').releasePointerCapture(e.pointerId);});
function zoom(f,cx=view.x+view.w/2,cy=view.y+view.h/2){const w=view.w*f;if(w<180||w>4500)return;view={x:cx+(view.x-cx)*f,y:cy+(view.y-cy)*f,w,h:view.h*f};applyView();}
$('#graph').addEventListener('wheel',e=>{e.preventDefault();const p=svgPoint(e);zoom(Math.exp(Math.max(-.2,Math.min(.2,e.deltaY*.001))),p.x,p.y);},{passive:false});
const tourNarration={};
function startTour(index=0){state.hidden.clear();state.path=[];state.tour=index;state.tourStep=0;setView('graph');updateAll();showTour();}
function showTour(){const tour=DATA.tours[state.tour],id=tour.node_ids[state.tourStep];selectNode(id);$('#tourbar').hidden=false;$('#tourProgress').textContent=`${tour.title} · ${state.tourStep+1} / ${tour.node_ids.length}`;$('#tourTitle').textContent=byId.get(id).label;$('#tourCopy').textContent=tourNarration[id]||byId.get(id).summary;$('#tourPrev').disabled=state.tourStep===0;$('#tourNext').textContent=state.tourStep===tour.node_ids.length-1?(state.tour===0?'AI product tour →':'Finish tour ✓'):'Next →';}
function stopTour(){state.tour=null;$('#tourbar').hidden=true;}
function reset(){stopTour();state.full=true;state.hidden.clear();state.path=[];state.selected=null;$('#full').checked=true;$('#search').value='';$('#searchResults').hidden=true;layout();setView('graph');updateAll();renderOverview();$('#traceStatus').textContent='Connections do not imply causation';$('#stageTitle').textContent='Career Knowledge Graph';}
document.addEventListener('click',e=>{const pick=e.target.closest('[data-pick]');if(pick){stopTour();selectNode(pick.dataset.pick);$('#searchResults').hidden=true;if(pick.closest('.search-results')){$('#search').value='';setView('graph');}}if(!e.target.closest('.search-wrap'))$('#searchResults').hidden=true;});
$('#categories').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;stopTour();state.path=[];state.hidden.has(b.dataset.cat)?state.hidden.delete(b.dataset.cat):state.hidden.add(b.dataset.cat);updateAll();});
$('#full').addEventListener('change',e=>{stopTour();state.full=e.target.checked;state.path=[];updateAll();});
$('#search').addEventListener('input',search);$('#search').addEventListener('focus',search);$('#search').addEventListener('keydown',e=>{if(e.key==='Enter'){$('#searchResults button')?.click();}if(e.key==='Escape')$('#searchResults').hidden=true;});
$('#reset').addEventListener('click',reset);$('#brand').addEventListener('click',e=>{e.preventDefault();reset();});$('#fit').addEventListener('click',fit);$('#zoomIn').addEventListener('click',()=>zoom(.8));$('#zoomOut').addEventListener('click',()=>zoom(1.25));$('#graphTab').addEventListener('click',()=>{stopTour();setView('graph');});$('#timeTab').addEventListener('click',()=>{stopTour();setView('timeline');});$('#traceButton').addEventListener('click',tracePath);
$('#tourStart').addEventListener('click',()=>startTour());$('#tourPrev').addEventListener('click',()=>{if(state.tourStep>0){state.tourStep--;showTour();}});$('#tourNext').addEventListener('click',()=>{if(state.tourStep<DATA.tours[state.tour].node_ids.length-1){state.tourStep++;showTour();}else if(state.tour===0)startTour(1);else{stopTour();closeDetails();}});$('#tourClose').addEventListener('click',stopTour);
$('#about').addEventListener('click',()=>$('#aboutDialog').showModal());$('#aboutClose').addEventListener('click',()=>$('#aboutDialog').close());$('#aboutDialog').addEventListener('click',e=>{if(e.target===$('#aboutDialog')){const r=e.target.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)e.target.close();}});
$('#downloadData').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(DATA,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='jiayi-career-graph-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();$('#search').focus();}if(e.key==='Escape'&&!$('#aboutDialog').open){stopTour();$('#searchResults').hidden=true;closeDetails();}});
$('#full').checked=true;layout();updateAll();renderOverview();

const sendHeight=()=>parent.postMessage({type:'career-graph-height',height:Math.ceil(document.body.getBoundingClientRect().height)},location.origin);new ResizeObserver(sendHeight).observe(document.body);sendHeight();
</script>
